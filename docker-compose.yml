version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: horplus_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horplus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-horplus}
      HORPLUS_APP_DB_USER: ${HORPLUS_APP_DB_USER:-horplus_app}
      HORPLUS_APP_DB_PASSWORD: ${HORPLUS_APP_DB_PASSWORD:-horplus_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01_init_runtime_role.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horplus} -d ${POSTGRES_DB:-horplus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: horplus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: horplus_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${HORPLUS_APP_DB_USER:-horplus_app}:${HORPLUS_APP_DB_PASSWORD:-horplus_dev_password}@postgres:5432/${POSTGRES_DB:-horplus}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-horplus}:${POSTGRES_PASSWORD:-horplus_dev_password}@postgres:5432/${POSTGRES_DB:-horplus}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:5173
      SESSION_ENCRYPTION_KEY: prod_session_secret_key_32_chars_long_0001
      CSRF_SIGNING_KEY: prod_csrf_signing_key_16_chars_min
      FIELD_ENCRYPTION_KEY: prod_field_encryption_key_32_chars_long_0001
      GOOGLE_CLIENT_ID: horplus-prod-google-client-id.apps.googleusercontent.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
