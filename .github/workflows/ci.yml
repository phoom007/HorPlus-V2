name: HorPlus CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Type Check & Lint
        run: npm run lint

      - name: Frontend Build
        run: npm run build

  backend-quality:
    name: Backend Quality Gate & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: horplus_test
          POSTGRES_USER: horplus_test
          POSTGRES_PASSWORD: horplus_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: postgresql://horplus_test:horplus_test_password@localhost:5432/horplus_test?schema=public
          DIRECT_URL: postgresql://horplus_test:horplus_test_password@localhost:5432/horplus_test?schema=public
        run: |
          cd server
          npm run prisma:validate
          npm run prisma:generate

      - name: Backend Type Check
        run: |
          cd server
          npm run lint

      - name: Bootstrap Runtime Database Role
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: horplus_test
          PGPASSWORD: horplus_test_password
          PGDATABASE: horplus_test
          HORPLUS_APP_DB_USER: horplus_app
          HORPLUS_APP_DB_PASSWORD: horplus_test_password
        run: bash ./docker/bootstrap-runtime-role.sh

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgresql://horplus_test:horplus_test_password@localhost:5432/horplus_test?schema=public
          DIRECT_URL: postgresql://horplus_test:horplus_test_password@localhost:5432/horplus_test?schema=public
        run: |
          cd server
          npm run prisma:migrate:deploy

      - name: Run Backend Tests
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://horplus_test:horplus_test_password@localhost:5432/horplus_test?schema=public
          DIRECT_URL: postgresql://horplus_test:horplus_test_password@localhost:5432/horplus_test?schema=public
          HORPLUS_APP_DB_USER: horplus_app
          HORPLUS_APP_DB_PASSWORD: horplus_test_password
          REDIS_URL: redis://localhost:6379
          LOG_LEVEL: fatal
          CORS_ORIGINS: http://localhost:5173
        run: |
          cd server
          npm run test -- --maxWorkers=1 --minWorkers=1 --no-file-parallelism

      - name: Build Backend TypeScript
        run: |
          cd server
          npm run build
